name: Release Build

concurrency:
  group: fpsaimforge-release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            python3 \
            curl \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libaudio-dev \
            libfribidi-dev \
            libjack-dev \
            libsndio-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libdrm-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libudev-dev \
            libthai-dev \
            libusb-1.0-0-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libdecor-0-dev \
            liburing-dev

      # Persisted replay metadata is intentionally kept outside the parity-protected gameplay files.
      # The guarded gameplay assets must remain byte-identical to upstream AimForge.
      - name: Verify legacy gameplay parity
        shell: bash
        run: |
          git fetch --depth=1 https://github.com/mjohns/FpsAimForge.git main
          git diff --exit-code FETCH_HEAD -- \
            src/aim/core/camera.cc \
            src/aim/scenario/base_scenario.cc \
            src/aim/scenario/base_scenario.h
      - name: Configure release build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build FpsAimForge
        run: cmake --build build --target FpsAimForge --parallel 2

      - name: Run tests
        run: |
          cmake --build build --target FpsAimForgeTests --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Package release binary
        run: |
          mkdir -p release
          cp build/bin/FpsAimForge release/FpsAimForge
          cp -r src/resources release/resources
          cp -r build/bin/shaders release/shaders

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: FpsAimForge-release
          path: release/
          if-no-files-found: error


  windows-release:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify legacy gameplay parity
        shell: pwsh
        run: |
          git fetch --depth=1 https://github.com/mjohns/FpsAimForge.git main
          git diff --exit-code FETCH_HEAD -- src/aim/core/camera.cc src/aim/scenario/base_scenario.cc src/aim/scenario/base_scenario.h
      - name: Configure Windows x64 release
        run: cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build FpsAimForge
        run: cmake --build build-windows --config Release --target FpsAimForge --parallel 2

      - name: Build and run tests
        run: |
          cmake --build build-windows --config Release --target FpsAimForgeTests --parallel 2
          ctest --test-dir build-windows --build-config Release --output-on-failure

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-windows | Out-Null
          Copy-Item build-windows/bin/Release/FpsAimForge.exe release-windows/FpsAimForge.exe
          Copy-Item -Recurse src/resources release-windows/resources
          Copy-Item -Recurse build-windows/bin/shaders release-windows/shaders

          # FFmpeg is used only to turn the app's captured replay frames into MP4 for
          # NVIDIA's hosted video-capable NIM endpoint. The binary is distributed
          # separately from the application source and remains unmodified.
          $ffmpegZip = "$env:RUNNER_TEMP\\ffmpeg902.zip"
          Invoke-WebRequest -Uri "https://github.com/SubtitleEdit/support-files/releases/download/ffmpeg-v9-2/ffmpeg902.zip" -OutFile $ffmpegZip

          # Validate the download against the digest published by GitHub for this release asset.
          # Fail closed if the release metadata does not contain a SHA-256 digest.
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/SubtitleEdit/support-files/releases/tags/ffmpeg-v9-2" -Headers @{ "User-Agent" = "FpsAimForge-release-build" }
          $publishedDigest = ($release.assets | Where-Object { $_.name -eq "ffmpeg902.zip" } | Select-Object -First 1 -ExpandProperty digest)
          if ([string]::IsNullOrWhiteSpace($publishedDigest) -or $publishedDigest -notmatch '^sha256:[0-9a-fA-F]{64}$') {
            throw "GitHub release metadata did not provide a SHA-256 digest for ffmpeg902.zip."
          }
          $expectedHash = $publishedDigest.Substring(7).ToLowerInvariant()
          $ffmpegHash = (Get-FileHash $ffmpegZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ffmpegHash -ne $expectedHash) {
            throw "FFmpeg archive checksum mismatch: downloaded bytes differ from the digest published by GitHub."
          }

          $ffmpegExtract = "$env:RUNNER_TEMP\\ffmpeg902"
          Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegExtract -Force
          Copy-Item "$ffmpegExtract\\ffmpeg.exe" release-windows/ffmpeg.exe
          if (-not (Test-Path release-windows/ffmpeg.exe)) { throw "Bundled FFmpeg executable missing." }

          if (-not (Test-Path release-windows/FpsAimForge.exe)) { throw "Windows executable missing from release package." }
          $shaderCount = (Get-ChildItem -Recurse -File release-windows/shaders | Measure-Object).Count
          if ($shaderCount -lt 1) { throw "Compiled shader package is empty." }

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: FpsAimForge-windows-x64
          path: release-windows/
          if-no-files-found: error) {
            throw "GitHub release metadata did not provide a SHA-256 digest for ffmpeg902.zip."
          }
          $expectedHash = $publishedDigest.Substring(7).ToLowerInvariant()
          $ffmpegHash = (Get-FileHash $ffmpegZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ffmpegHash -ne $expectedHash) {
            throw "FFmpeg archive checksum mismatch: downloaded bytes differ from the digest published by GitHub."
          }
          $ffmpegExtract = "$env:RUNNER_TEMP\\ffmpeg902"
          Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegExtract -Force
          Copy-Item "$ffmpegExtract\\ffmpeg.exe" release-windows/ffmpeg.exe
          if (-not (Test-Path release-windows/ffmpeg.exe)) { throw "Bundled FFmpeg executable missing." }

          if (-not (Test-Path release-windows/FpsAimForge.exe)) { throw "Windows executable missing from release package." }
          $shaderCount = (Get-ChildItem -Recurse -File release-windows/shaders | Measure-Object).Count
          if ($shaderCount -lt 1) { throw "Compiled shader package is empty." }

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: FpsAimForge-windows-x64
          path: release-windows/
          if-no-files-found: error
