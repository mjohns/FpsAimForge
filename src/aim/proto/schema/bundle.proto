edition = "2023";

import "scenario.proto";
import "playlist.proto";
import "guide.proto";

package aim;

message BundleScenario {
  string name = 1;
  ScenarioDef def = 2;
}

message BundlePlaylist {
  string name = 1;
  PlaylistDef def = 2;
}

message BundleGuide {
  string name = 1;
  GuideDef def = 2;
}

message BundleFile {
  repeated BundleScenario scenarios = 1;
  repeated BundlePlaylist playlists = 2;
  repeated BundleGuide guides = 3;
}

message BundlePackItem {
  string name = 1;
  BundleFile file = 2;
}

message BundlePack {
  repeated BundlePackItem items = 1;
}

message BundleInfo {
  string bundle_name = 1;
  bool readonly = 2;
  bool archived = 3;
  // Optional. The bundle pack the bundle comes from.
  string bundle_pack_name = 4;
}

message BundlePackInfo {
  string bundle_pack_name = 1;
  bool archived = 2;
  // Supports a URL to a zip archive containing the individual bundle files or
  // a github URL like https://github.com/mjohns/FpsAimForgeBundles.
  string source_url = 3;
  // For URLs that support checking the current version (github), automatically check
  // if there is a new version and show download option in top right if there is a new
  // version.
  bool automatically_check_for_updates = 4;
  repeated string bundle_names = 5;
}

// Structure for bundles.json file.
message BundleInfoFile {
  repeated BundleInfo bundles = 1;
  repeated BundlePackInfo bundle_packs = 2;
}
